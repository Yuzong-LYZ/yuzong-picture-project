#下面这些内容是为了让MyBatis映射
#指定Mybatis的Mapper文件
#mybatis.mapper-locations=classpath:mappers/*xml
#指定Mybatis的实体目录
#mybatis.type-aliases-package=com.yuzong.yuzongpicturebackend.mybatis.entity
# 应用服务 WEB 访问端口
#server.port=8080

server:
   port: 8123
   servlet:
     context-path: /api
spring:
   application:
     name: yuzong-picture-backend
#数据库配置
   datasource:
     driver-class-name: com.mysql.cj.jdbc.Driver
     url: jdbc:mysql://localhost:3306/yuzong_picture
     username: root
     password: 123456

mybatis-plus:
  confiiguration:
#      驼峰命名
      map-underscore-to-camel-case: false
#      仅在开发环境中打印日志
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete  # 全局逻辑删除字段名
      logic-delete-value: 1  # 逻辑已删除值（默认1）
      logic-not-delete-value: 0  #逻辑未删除值（默认0）
#   配置接口文档
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
#        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.yuzong.yuzongpicturebackend.controller